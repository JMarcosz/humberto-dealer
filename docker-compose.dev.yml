# ==============================================================================
# Docker Compose para Desarrollo (Hot-Reloading)
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ==============================================================================
services:
  backend:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: ["flask", "run", "--host=0.0.0.0", "--port=5001", "--reload"]

  frontend:
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["pnpm", "run", "dev"]
