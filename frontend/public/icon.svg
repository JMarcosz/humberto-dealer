<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#080c14" />
    </radialGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7700" />
      <stop offset="100%" stop-color="#FF4400" />
    </linearGradient>
    <linearGradient id="car-metallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bg-glow)" />

  <!-- Outer Orange Rings -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#orange-grad)" stroke-width="14" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2" />

  <!-- Car Roof & Windshield Outline -->
  <path d="M120 250 C140 210, 190 170, 256 170 C322 170, 372 210, 392 250 C370 235, 330 220, 256 220 C182 220, 142 235, 120 250 Z" 
        fill="url(#car-metallic)" />
  
  <!-- Windshield Center Streak (aerodynamic reflection) -->
  <path d="M246 175 C252 175, 254 185, 250 200 C246 215, 240 220, 245 220 C250 220, 260 215, 268 200 C274 188, 270 175, 266 175 Z"
        fill="#080c14" />

  <!-- Headlights / Aerodynamic Wing lines -->
  <path d="M100 242 C120 236, 145 242, 160 252 C135 258, 115 258, 100 242 Z" fill="#FFFFFF" />
  <path d="M412 242 C392 236, 367 242, 352 252 C377 258, 397 258, 412 242 Z" fill="#FFFFFF" />

  <!-- Front Bumper / Air Intakes -->
  <path d="M110 270 C160 305, 220 310, 256 310 C292 310, 352 305, 402 270 C360 292, 300 298, 256 298 C212 298, 152 292, 110 270 Z" 
        fill="url(#orange-grad)" />

  <!-- HUMBERTO wordmark in SVG -->
  <text x="256" y="365" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" 
        font-style="italic"
        font-size="52" 
        fill="url(#orange-grad)" 
        text-anchor="middle" 
        letter-spacing="2">HUMBERTO</text>

  <!-- AUTO IMPORT wordmark in SVG -->
  <text x="256" y="405" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="22" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="9">AUTO IMPORT</text>

  <!-- Subtitle accent -->
  <line x1="160" y1="425" x2="352" y2="425" stroke="#FF5500" stroke-width="3" stroke-linecap="round" />
</svg>